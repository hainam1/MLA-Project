project:
  name: english-sentence-cefr-classification
  random_seed: 42
  cefr_levels: [A1, A2, B1, B2, C1]
  purpose: academic_language_learning_support
  commercial_use_allowed: false

task:
  type: ordinal_multiclass_classification
  input: english_sentence
  target: cefr_level
  primary_metric: macro_f1
  ordinal_metric: quadratic_weighted_kappa

data:
  primary:
    - dataset_id: UniversalCEFR/cefr_sp_en
      source_name: cefr_sp_en
      revision: b78901348bda9f5a823cd3da1f3fcb2dcc6c5725
    - dataset_id: UniversalCEFR/readme_en
      source_name: readme_en
      revision: 88ce5b3736bdb666b1f64f738451676b12028a33
  auxiliary_word_lexicon:
    enabled: true
    purpose: aggregate_sentence_features_only
    ablation_required: true
  valid_levels: [A1, A2, B1, B2, C1]
  split:
    strategy: stratified_group_kfold
    group: cluster_id
    train_validation_test: [0.70, 0.15, 0.15]
    near_duplicate_jaccard: 0.80
    near_duplicate_sequence_ratio: 0.75

models:
  required_families:
    instance_based:
      estimator: knn_classifier
      preprocessing: median_imputer_then_standard_scaler
      validation_grid:
        n_neighbors: [3, 5, 7, 11, 15]
        weights: [uniform, distance]
        p: [1, 2]
    tree_based:
      estimator: decision_tree_classifier
      class_weight: balanced
      validation_grid:
        max_depth: [4, 6, 8, 12, null]
        min_samples_split: [2, 4, 10]
        min_samples_leaf: [1, 2, 5, 10]
        criterion: [gini, entropy]
  sanity_baseline: majority_class
  selection_metric: macro_f1

contextual_extension:
  enabled: false
  model: microsoft/deberta-v3-small
  frozen: true
  pooling: mean
  pca_dimensions_to_validate: [16, 32, 64]
  fit_pca_on: train_only
  note: optional_feature_representation_not_a_required_model_family

evaluation:
  metrics:
    - macro_f1
    - quadratic_weighted_kappa
    - accuracy
    - weighted_f1
    - adjacent_accuracy
    - mean_absolute_level_error
  bootstrap_samples: 1000
  confidence_level: 0.95
  error_slices: [level, error_distance, length, lexical_rarity, syntax, source, confidence]

paths:
  cleaned_sentences: data/processed/cefr_sentences_clean.csv
  sentence_features: data/processed/cefr_sentence_features.csv
  auxiliary_lexicon: data/processed/cefr_wordlist_clean.csv
  split_prefix: data/processed/sentence_cefr
  model_dir: src/models/sentence_cefr
  report_dir: reports
